{% extends "base.html" %}
{% block content %}
<h1>All orders</h1>
<table>
  <tr><th>#</th><th>Customer</th><th>Address</th><th>Total</th><th>Status</th></tr>
  {% for o in orders %}
  <tr><td>{{ o['id'] }}</td><td>{{ o['username'] }} ({{ o['email'] }})</td><td>{{ o['address'] }}</td>
      <td>{{ o['total'] }} UZS</td><td>{{ o['status'] }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
